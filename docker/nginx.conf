worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_shutdown_timeout 30s;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Log routing and timing only; no bodies, query strings or financial headers.
    log_format demo escape=json
        '{"time":"$time_iso8601","method":"$request_method",'
        '"status":$status,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","duration":$request_time}';
    access_log /dev/stdout demo;

    upstream demo_api {
        zone demo_api 64k;
        resolver 127.0.0.11 valid=1s ipv6=off;
        resolver_timeout 1s;
        server api-1:3000 resolve;
        server api-2:3000 resolve;
        server api-3:3000 resolve;
    }

    server {
        listen 8080;
        add_header X-Demo-Upstream $upstream_addr always;
        proxy_hide_header X-Demo-Upstream;

        location = /health/live {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location / {
            proxy_pass http://demo_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_pass_header Server;
            proxy_pass_header Date;
            proxy_connect_timeout 1s;
            # Never retry a non-idempotent request after it has been sent.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
            error_page 502 504 =503 @unavailable;
        }

        location @unavailable {
            default_type application/json;
            return 503 '{"status":"unavailable"}';
        }
    }
}
