name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    quality:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            - run: bun run format:check
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run build

    integration:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            COMPOSE_PARALLEL_LIMIT: '2'
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            - run: docker version && docker compose version
            - name: Full suite with real PostgreSQL and LocalStack
              run: bun run test 2>&1 | tee integration.log
            - name: Remove disposable test resources
              if: always()
              run: |
                  mapfile -t containers < <(docker ps -aq --filter 'name=^/dwp-')
                  if ((${#containers[@]})); then docker rm -f "${containers[@]}"; fi
                  mapfile -t networks < <(docker network ls -q --filter label=com.docker.compose.project)
                  if ((${#networks[@]})); then docker network rm "${networks[@]}"; fi
                  mapfile -t volumes < <(docker volume ls -q --filter label=com.docker.compose.project)
                  if ((${#volumes[@]})); then docker volume rm "${volumes[@]}"; fi
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: always()
              with:
                  name: integration-log
                  path: integration.log
                  retention-days: 7

    docker-smoke:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Start from a fresh Docker project
              run: docker compose -f compose.demo.yaml up -d --build --wait --wait-timeout 180
            - name: Smoke twice with unique identities
              run: |
                  docker compose -f compose.demo.yaml ps -q nginx api-1 api-2 api-3 consumer-1 consumer-2 publisher-1 publisher-2 pending-worker | sort > demo-containers-before.txt
                  test "$(wc -l < demo-containers-before.txt)" -eq 9
                  docker compose -f compose.demo.yaml run --rm smoke
                  docker compose -f compose.demo.yaml run --rm smoke
                  docker compose -f compose.demo.yaml ps -q nginx api-1 api-2 api-3 consumer-1 consumer-2 publisher-1 publisher-2 pending-worker | sort > demo-containers-after.txt
                  diff -u demo-containers-before.txt demo-containers-after.txt
            - name: Repeated startup and graceful restart
              run: |
                  docker compose -f compose.demo.yaml up -d --wait --wait-timeout 180
                  docker compose -f compose.demo.yaml restart nginx api-1 api-2 api-3 consumer-1 consumer-2 publisher-1 publisher-2 pending-worker
                  docker compose -f compose.demo.yaml up -d --wait --wait-timeout 180
                  docker compose -f compose.demo.yaml run --rm smoke
            - name: Serve with two APIs and rediscover a recreated backend
              run: |
                  nginx_id=$(docker compose -f compose.demo.yaml ps -q nginx)
                  old_api_id=$(docker compose -f compose.demo.yaml ps -q api-3)
                  old_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$old_api_id")
                  docker compose -f compose.demo.yaml stop api-3
                  for i in {1..12}; do
                    curl --fail --silent --show-error --max-time 5 --dump-header - http://127.0.0.1:3000/health/ready -o /dev/null
                  done > demo-degraded-headers.log
                  for service in api-1 api-2; do
                    id=$(docker compose -f compose.demo.yaml ps -q "$service")
                    ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$id")
                    grep -Fq "$ip:3000" demo-degraded-headers.log
                  done
                  wallet=$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/wallets -H 'Content-Type: application/json' --data "{\"playerId\":\"degraded-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\",\"initialBalance\":{\"amount\":\"100.00\",\"currency\":\"BRL\"}}")
                  echo "$wallet" | jq -e '.balance == {amount: "100.00", currency: "BRL"}'
                  wallet_id=$(echo "$wallet" | jq -r '.id')
                  curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:3000/wallets/$wallet_id" | jq -e '.balance == {amount: "100.00", currency: "BRL"}'
                  # Reserve the released address so recreation really tests Docker DNS updates.
                  docker compose -f compose.demo.yaml rm -f api-3
                  trap 'docker rm -f dwp-demo-old-api-address || true' EXIT
                  docker run -d --rm --name dwp-demo-old-api-address --network dwp-demo_default --ip "$old_ip" --entrypoint sleep nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03 180
                  docker compose -f compose.demo.yaml up -d --no-deps --force-recreate --wait --wait-timeout 180 api-3
                  test "$old_api_id" != "$(docker compose -f compose.demo.yaml ps -q api-3)"
                  new_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose -f compose.demo.yaml ps -q api-3)")
                  test "$old_ip" != "$new_ip"
                  echo "api-3 address changed: $old_ip -> $new_ip"
                  test "$nginx_id" = "$(docker compose -f compose.demo.yaml ps -q nginx)"
                  docker compose -f compose.demo.yaml run --rm smoke
            - name: Smoke must fail with Nginx stopped
              run: |
                  docker compose -f compose.demo.yaml stop nginx
                  if docker compose -f compose.demo.yaml run --rm smoke; then
                    echo 'Smoke incorrectly accepted an unavailable Nginx'
                    exit 1
                  fi
                  docker compose -f compose.demo.yaml up -d --no-deps --wait --wait-timeout 180 nginx
            - name: No APIs returns 503 while Nginx stays live
              run: |
                  docker compose -f compose.demo.yaml stop api-1 api-2 api-3
                  test "$(curl --silent --show-error --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health/ready)" = 503
                  curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/health/live
                  docker compose -f compose.demo.yaml up -d --no-deps --wait --wait-timeout 180 api-1 api-2 api-3
                  docker compose -f compose.demo.yaml run --rm smoke
            - name: Collect diagnostics
              if: always()
              run: |
                  docker compose -f compose.demo.yaml ps -a > demo-status.log
                  docker compose -f compose.demo.yaml logs --no-color > demo.log
            - name: Stop and remove the disposable demo
              if: always()
              run: docker compose -f compose.demo.yaml down --volumes --remove-orphans
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: always()
              with:
                  name: demo-logs
                  path: |
                      demo.log
                      demo-status.log
                      demo-containers-before.txt
                      demo-containers-after.txt
                      demo-degraded-headers.log
                  retention-days: 7
