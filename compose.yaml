services:
    localstack:
        profiles: [sqs]
        image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        environment:
            SERVICES: sqs
            AWS_DEFAULT_REGION: us-east-1
            SQS_ENDPOINT_STRATEGY: dynamic
        ports:
            - '127.0.0.1:${SQS_PORT:-4566}:4566'
        healthcheck:
            test: [CMD, awslocal, sqs, list-queues]
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 5s
    postgres:
        image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 2s
            timeout: 3s
            retries: 30
            start_period: 5s

volumes:
    postgres_data:
